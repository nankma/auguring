# Local-dev settings file -- committed, safe forever, working example.
# This is what SETTINGS_FILE defaults to (app_settings.py) if unset --
# clone this repo, run it, works as-is; edit freely for your own
# paths/values. Never put a real secret/OCID/IP/hostname in this file --
# see CLAUDE.md's Landmines.
#
# Only sections that have actually been migrated exist here -- see
# docs/standaloneplan/01-settings-migration.md for what hasn't moved off
# raw os.environ yet.

storage:
  # Where fetched articles are cached, and how long they stay before
  # cleanup_expired removes them (or moves them to news_archive_dir, if
  # set).
  news_cache_dir:
    path: news_cache
    ttl_hours: 48
  # The actual message text delivered to a subscriber (an audit trail --
  # distinct from push_outcomes' pass/fail status below).
  message_archive_dir:
    path: message_archive
    ttl_days: 7
  # Pluggable storage backend (storage/) -- `type` selects
  # SqliteStorage (default, zero-ops) or PostgresStorage; only the
  # matching sub-block below is read. See
  # docs/plans/data-layer-plan.md's "Seam built" section.
  database:
    type: sqlite
    sqlite:
      path: subscribers.db
    # postgres:
    #   host: localhost
    #   port: 5432
    #   dbname: myfirstagent
    #   user: myfirstagent
    #   password:
    #     trailsign-resolve: environment-variable
    #     name: POSTGRES_PASSWORD
  # Set this to archive expired articles instead of deleting them (no
  # ttl_hours -- nothing prunes this directory by age):
  # news_archive_dir: news_archive

# Pluggable news-cache backend (vector_store/) -- `type` selects
# YamlFilesStore (default, one YAML file per article, uses storage.
# news_cache_dir/news_archive_dir above) or SqliteVecStore (a single
# SQLite file + the sqlite-vec extension -- faster bulk reads and, later,
# indexed similarity search; see vector_store/sqlite_vec_store.py's own
# docstring for the measured bottleneck this fixes). Only the matching
# sub-block below is read.
news_cache:
  backend:
    type: yaml_files
    # sqlite_vec:
    #   path: news_cache_vec.db

# The AI connector -- works with any provider speaking the OpenAI
# /chat/completions wire format (Together.ai, Groq, Fireworks, a
# self-hosted vLLM server, ...). `main` is the agent's own model;
# `guardrail` backs the router/output-check layers (guardrails.py) --
# independently swappable, shown here pointed at the same model.
# reasoning_effort/request_timeout_seconds are optional; omit
# reasoning_effort for a provider that doesn't accept it.
models:
  main:
    url: https://api.deepseek.com
    model: deepseek-v4-flash
    api-key:
      trailsign-resolve: environment-variable
      name: DEEPSEEK_API_KEY
    reasoning_effort: none
    request_timeout_seconds: 60
  guardrail:
    url: https://api.deepseek.com
    model: deepseek-v4-flash
    api-key:
      trailsign-resolve: environment-variable
      name: DEEPSEEK_API_KEY
    reasoning_effort: none
    # Shorter than main's -- backs a live Telegram user's own message,
    # not a background batch job (agent.build_model_from_config's docstring).
    request_timeout_seconds: 20

# The news-fetching pipeline. ONE news_source: key for the whole file --
# a second top-level `news_source:` mapping silently shadows this entire
# block (YAML duplicate-key behavior), it does not merge with it.
#
# tick_seconds: how often the scheduler checks whether anything's due.
# default_interval_hours: fallback pull interval for a source with no
# per-source override. request_delay_seconds: delay between consecutive
# same-source requests.
news_source:
  tick_seconds: 900
  default_interval_hours: 4
  request_delay_seconds: 1.1

  # Free, no-key RSS feeds -- add/remove/edit a feed by editing this
  # list, no code change needed. Example entry:
  #   - key: some_source
  #     display_name: Some Source
  #     url: https://example.com/feed.xml
  # Keep this list identical to settings.oracle.yml's -- production
  # reads that file, not this one.
  rss:
    # --- AI/ML publications ---------------------------------------------
    - key: openai_blog
      display_name: OpenAI Blog
      url: https://openai.com/news/rss.xml
    - key: huggingface_blog
      display_name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml
    - key: techcrunch_ai
      display_name: TechCrunch AI
      url: https://techcrunch.com/category/artificial-intelligence/feed/
    - key: venturebeat_ai
      display_name: VentureBeat AI
      url: https://venturebeat.com/category/ai/feed/
      # Found 2026-09-14/15: the whole venturebeat.com domain (now on
      # Vercel) returns a site-wide bot-challenge 429 to every automated
      # request, feed included -- not a frequency problem (confirmed live:
      # even a single fresh request from an unrelated IP gets challenged).
      # Throttled to once/day rather than removed, purely to monitor for
      # when their WAF config gets fixed -- raise back to the default
      # once a pull actually succeeds again.
      interval_hours: 24
    - key: mit_tech_review
      display_name: MIT Technology Review
      url: https://www.technologyreview.com/feed/

    # --- Mainstream press: Business/Finance sections ---------------------
    - key: bbc_business
      display_name: BBC Business
      url: http://feeds.bbci.co.uk/news/business/rss.xml
    - key: guardian_business
      display_name: The Guardian Business
      url: https://www.theguardian.com/business/rss
    - key: marketwatch
      display_name: MarketWatch
      url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    - key: economist_business
      display_name: The Economist (Business)
      url: https://www.economist.com/business/rss.xml
    - key: nikkei_asia
      display_name: Nikkei Asia
      url: https://asia.nikkei.com/rss/feed/nar

    # --- Mainstream press: Technology sections ----------------------------
    - key: bbc_technology
      display_name: BBC Technology
      url: http://feeds.bbci.co.uk/news/technology/rss.xml
    - key: guardian_technology
      display_name: The Guardian Technology
      url: https://www.theguardian.com/technology/rss
    - key: economist_tech
      display_name: The Economist (Science & Technology)
      url: https://www.economist.com/science-and-technology/rss.xml
    - key: wired_business
      display_name: Wired Business
      url: https://www.wired.com/feed/category/business/latest/rss

    # --- Enterprise/industry IT trade press -------------------------------
    - key: the_register
      display_name: The Register
      url: https://www.theregister.com/headlines.atom
    - key: ars_technica
      display_name: Ars Technica
      url: https://feeds.arstechnica.com/arstechnica/index
    - key: techcrunch
      display_name: TechCrunch
      url: https://techcrunch.com/feed/
    - key: cnbc
      display_name: CNBC
      url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114
    - key: computerworld
      display_name: Computerworld
      url: https://www.computerworld.com/index.rss

    # --- Consumer/gadget tech press ----------------------------------------
    - key: zdnet
      display_name: ZDNet
      url: https://www.zdnet.com/rss/all/
    - key: engadget
      display_name: Engadget
      url: https://www.engadget.com/rss.xml
    - key: techradar
      display_name: TechRadar
      url: https://www.techradar.com/rss

  # Optional, credential-gated sources: one entry per source, `type`
  # selects the news_adapters/*.py class that handles it, `key` is this
  # source's own registry identity. interval_hours/daily_cap override
  # news_source.default_interval_hours per source; omit either to use
  # the global default / no cap. An entry whose api-key can't resolve
  # (e.g. an unset env var) is silently skipped, so leave a source
  # entirely out of this list rather than uncommenting it with a
  # placeholder you don't intend to fill in.
  #
  # api:
  #   - key: newsapi
  #     type: newsapi
  #     api-key:
  #       trailsign-resolve: environment-variable
  #       name: NEWSAPI_API_KEY
  #     interval_hours: 24
  #     daily_cap: 1
  #   - key: gnews
  #     type: gnews
  #     api-key:
  #       trailsign-resolve: environment-variable
  #       name: GNEWS_API_KEY
  #   - key: perigon
  #     type: perigon
  #     api-key:
  #       trailsign-resolve: environment-variable
  #       name: PERIGON_API_KEY
  #     interval_hours: 8
  #     daily_cap: 3

# Push job mechanics -- how the push job builds/paces one digest, as
# opposed to subscription.* below (the subscriber's own cadence
# preference). tick_seconds: scheduler cadence. max_articles_per_topic/
# max_interests_per_push: how much one subscriber gets in one cycle.
# relevance_keep/novelty_relevance_keep: {fraction, min, max} clamps on
# how many candidate articles survive the relevance filter.
# near_duplicate_similarity: cosine-similarity threshold two articles
# collapse at. max_article_age_hours: ceiling on an article's own
# publish date. max_html_attempts: retry budget for valid Telegram
# HTML. unreachable_strikes: consecutive failed digests before push
# turns off for that subscriber.
push:
  tick_seconds: 900
  max_articles_per_topic: 5
  max_interests_per_push: 5
  max_html_attempts: 3
  near_duplicate_similarity: 0.95
  max_article_age_hours: 168
  unreachable_strikes: 3
  relevance_keep:
    fraction: 0.10
    min: 20
    max: 50
  novelty_relevance_keep:
    fraction: 0.20
    min: 40
    max: 100

# search_news (agent.py): an on-demand lookup over the same ingested
# cache push reads, not a live source fetch. max_results: articles
# returned per search (matches push.max_articles_per_topic -- same
# per-topic volume, deliberately). relevance_keep: {fraction, min, max}
# clamp on the same news_embed.filter_by_relevance pass push uses, with
# its own values since search's pool (the whole cache, no category
# pre-filter) differs from push's per-topic one. daily_limit: max
# search_news calls per subscriber per UTC day.
search:
  max_results: 5
  daily_limit: 10
  relevance_keep:
    fraction: 0.10
    min: 20
    max: 50

# The "help me find my interests" conversation (interest_finder.py).
# max_examples: how many real headlines one example-showing step puts in
# front of the subscriber -- a "how much can a person weigh at once"
# number (docs/analysis/interest-elicitation-survey.md), not a retrieval
# one. max_turns: hard ceiling on user turns in one exploration, enforced
# by bot.py, so a subscriber who keeps switching direction gets told
# honestly it isn't working instead of looping. max_steps_per_turn: cap
# measured, not guessed -- an uncovered topic makes the model rephrase and
# re-search ~15 times, so 10 (the first value) cut real work off; see
# docs/plans/interest-finder-plan.md's "two ceilings" section.
# on model/tool steps WITHIN one turn -- the unbounded-cost failure PR #85
# measured, and a different thing from max_turns.
interest_finder:
  max_examples: 5
  max_turns: 8
  max_steps_per_turn: 20

# Free-trial usage caps, assigned once per subscriber at approval time
# (subscriber_ops.decide) -- see docs/plans/bot-features-plan.md section
# 6. agent_interaction_limit: how many messages reach the router/agent
# pipeline before that subscriber is cut off (admin-resettable).
# push_limit: how many push cycles they receive before push turns off
# (also admin-resettable, and re-enables push on reset). A subscriber
# approved before this existed has no limit at all (NULL in the DB, not
# this default) -- these numbers only ever apply to a NEW approval.
trial:
  agent_interaction_limit: 50
  push_limit: 20

# Per-subscriber account settings. default_interval_hours/
# min_interval_hours: push-frequency default and floor a subscriber can
# set. pushed_link_retention_hours: how long the "already sent this
# link" dedup memory lasts. max_interests: per-subscriber interest cap.
subscription:
  default_interval_hours: 24
  min_interval_hours: 1
  pushed_link_retention_hours: 72
  max_interests: 10

# The category-taxonomy-proposal feature. proposal_threshold: sightings
# of an out-of-taxonomy label needed before an admin is asked to
# activate/merge/reject it. sighting_retention_days: how far back those
# sightings count.
categories:
  proposal_threshold: 5
  sighting_retention_days: 30

# Delivery channel config -- currently just Telegram. bot-token: the
# info bot's own token (what subscribers talk to). admin-bot-token: the
# SEPARATE second bot admin_bot.py runs (category proposal review,
# access-request approval). admin-chat-id: the operator's own numeric
# Telegram user id.
delivery:
  telegram:
    bot-token:
      trailsign-resolve: environment-variable
      name: TELEGRAM_BOT_TOKEN
    admin-bot-token:
      trailsign-resolve: environment-variable
      name: ADMIN_BOT_TOKEN
    admin-chat-id:
      trailsign-resolve: environment-variable
      name: ADMIN_CHAT_ID

# Pluggable telemetry providers (telemetry.py, telemetry_providers/) --
# one list, empty/absent by default (telemetry off). Each entry's `type`
# selects a provider class, whose own KIND decides whether it receives
# general app-event logging, LLM-call tracing, or both -- e.g. otlp
# below feeds both from one entry. instrument_langchain additionally
# attaches LangChain's auto-instrumentation for that entry.
#
# Left commented out here -- uncomment and fill in your own
# endpoint/token to test telemetry locally. endpoint is computed once
# per provider/region (see agent.logfire_traces_endpoint for Logfire's
# own token-to-endpoint tool) and pasted in as a literal value.
#
# telemetry:
#   providers:
#     - type: otlp
#       endpoint: https://logfire-us.pydantic.dev/v1/traces
#       headers:
#         Authorization:
#           trailsign-resolve: environment-variable
#           name: LOGFIRE_API_KEY
#       instrument_langchain: true

# test_api.py's local HTTP debug endpoint (POST /test_message) -- a
# curl-friendly way to exercise the bot's pipeline without a real
# Telegram client. Both optional: enabled defaults to off (server never
# starts); port defaults to 8765.
test_api:
  enabled:
    trailsign-resolve: environment-variable
    name: ENABLE_TEST_API
  port:
    trailsign-resolve: environment-variable
    name: TEST_API_PORT
