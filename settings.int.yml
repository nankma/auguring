# Local INT-environment settings file -- same real-values-forbidden
# criterion as settings.yml/settings.oracle.yml (CLAUDE.md's Landmines).
# A separate file from settings.oracle.yml on purpose: editing that
# file's models.* to test something would repoint PRODUCTION at it too.
# Selected via -e SETTINGS_FILE=/app/settings.int.yml on the INT
# container only. storage.*/delivery.*/etc. mirror settings.oracle.yml's
# shape exactly -- only models.*/telemetry.* deliberately differ, see
# each section below for why.

storage:
  news_cache_dir:
    path:
      trailsign-resolve: environment-variable
      name: NEWS_CACHE_DIR
    ttl_hours: 48
  news_archive_dir:
    trailsign-resolve: environment-variable
    name: NEWS_ARCHIVE_DIR
  message_archive_dir:
    path:
      trailsign-resolve: environment-variable
      name: MESSAGE_ARCHIVE_DIR
    ttl_days: 7
  # Switched back to sqlite 2026-09-04 (after a live Postgres test,
  # 2026-09-03 onward, against a container on the DEV MACHINE --
  # 192.168.0.26:5432, database myfirstagent_int -- verified working via
  # tools/migrate_sqlite_to_postgres.py and a real deploy; see
  # docs/plans/data-layer-plan.md's "Seam built" section). The postgres
  # block below is commented out, not deleted, so switching back is a
  # one-line swap -- see storage/postgres/'s own adapter, still exercised
  # by tests/test_storage.py even while INT itself runs sqlite.
  database:
    type: sqlite
    sqlite:
      path: {trailsign-resolve: environment-variable, name: SUBSCRIBERS_DB_FILE}
    # postgres block commented out, not deleted -- one-line swap back if
    # needed. See the comment above this block for the Postgres cutover
    # history.
    # postgres:
    #   host: "192.168.0.26"
    #   port: 5432
    #   dbname: myfirstagent_int
    #   user: myfirstagent
    #   password:
    #     trailsign-resolve: environment-variable
    #     name: POSTGRES_PASSWORD

# Pluggable news-cache backend (vector_store/) -- INT is where sqlite_vec
# gets proven live first, same "test infra lives here before PROD"
# pattern as storage.database's own Postgres test above. yaml_files
# block kept commented out, not deleted, for a one-line revert.
news_cache:
  backend:
    type: sqlite_vec
    # yaml_files: {}
    sqlite_vec:
      path:
        trailsign-resolve: environment-variable
        name: NEWS_VECTOR_DB_FILE

# main: identical to production on purpose (the model that matters for
# actual reply quality). guardrail: routed through a SEPARATE Together.ai
# account instead of DeepSeek direct, deliberately -- so INT's high
# guardrail call volume can't drain or rate-limit-starve the main
# DeepSeek API key. Two cheaper Together candidates were tried and
# rejected (real failures under load, not just a price choice) -- don't
# swap this model without reading
# docs/standaloneplan/01-settings-migration.md's "models.*" section
# first.
models:
  main:
    url: https://api.deepseek.com
    model: deepseek-v4-flash
    api-key:
      trailsign-resolve: environment-variable
      name: DEEPSEEK_API_KEY
    reasoning_effort: none
    request_timeout_seconds: 60
  guardrail:
    url: https://api.together.xyz/v1
    model: deepseek-ai/DeepSeek-V4-Flash-0731
    api-key:
      trailsign-resolve: environment-variable
      name: TOGETHER_API_KEY
    request_timeout_seconds: 20

# ONE news_source: key for the whole file -- a second top-level mapping
# silently drops everything above it (real incident, see
# docs/standaloneplan/01-settings-migration.md's "news_source.*"
# section). Keep the rss: list byte-identical to the other two files'.
news_source:
  tick_seconds: 900
  default_interval_hours: 4
  request_delay_seconds: 1.1

  # No api: block here (unlike settings.oracle.yml's live one) --
  # newsapi/gnews/perigon aren't a standing INT config. They ran here
  # temporarily for a one-day live test (see local-infra/infrastructure.yaml's
  # history for what that confirmed); settings.oracle.yml's api: block is
  # the ready-to-copy shape if they need to come back.

  rss:
    - key: openai_blog
      display_name: OpenAI Blog
