# See settings.yml's own comments for what each of these controls.
push:
  tick_seconds: 900
  max_articles_per_topic: 5
  max_interests_per_push: 5
  max_html_attempts: 3
  near_duplicate_similarity: 0.95
  max_article_age_hours: 168
  unreachable_strikes: 3
  relevance_keep:
    fraction: 0.10
    min: 20
    max: 50
  novelty_relevance_keep:
    fraction: 0.20
    min: 40
    max: 100

search:
  max_results: 5
  daily_limit: 10
  relevance_keep:
    fraction: 0.10
    min: 20
    max: 50

subscription:
  default_interval_hours: 24
  min_interval_hours: 1
  pushed_link_retention_hours: 72
  max_interests: 10

categories:
  proposal_threshold: 5
  sighting_retention_days: 30

# Same env var names as settings.oracle.yml, but INT's docker_run.command
# sets them as plain literal values, not via vault/*_SECRET_OCID.
delivery:
  telegram:
    bot-token:
      trailsign-resolve: environment-variable
      name: TELEGRAM_BOT_TOKEN
    admin-bot-token:
      trailsign-resolve: environment-variable
      name: ADMIN_BOT_TOKEN
    admin-chat-id:
      trailsign-resolve: environment-variable
      name: ADMIN_CHAT_ID

# No telemetry.providers here on purpose -- INT doesn't share PROD's
# Logfire project (would defeat PROD's dead-man's-switch alerts and
# commingle trace data). Was live TEMPORARILY, 2026-09-02 to 2026-09-04,
# for a real test of the pluggable telemetry_providers/ architecture
# (file + a self-hosted phoenix container); removed once that test
# finished -- see docs/standaloneplan/01-settings-migration.md's
# "Telemetry providers" sections for the shape to copy if this needs to
# come back.

test_api:
  enabled:
    trailsign-resolve: environment-variable
    name: ENABLE_TEST_API
  port:
    trailsign-resolve: environment-variable
    name: TEST_API_PORT
