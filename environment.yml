name: myfirstagent
channels:
  - conda-forge
dependencies:
  - python=3.11
  - langchain
  - langchain-deepseek
  # Generic adapter for ANY OpenAI-wire-compatible provider (same
  # /chat/completions request/response shape as DeepSeek's own API) --
  # Together.ai, Groq, Fireworks, a self-hosted vLLM server, etc. --
  # via ChatOpenAI(base_url=..., api_key=..., model=...). Not
  # OpenAI-specific despite the package name; Anthropic/Claude is NOT
  # wire-compatible (different headers, different JSON shape) and would
  # need langchain-anthropic separately if ever added.
  - langchain-openai
  - requests
  - feedparser
  - pyyaml
  - pytest
  - pytest-cov
  - requests-mock
  - openinference-instrumentation-langchain
  # Imported directly, not just pulled in transitively: news_push.py's
  # heartbeat span needs the api, and agent.py's Logfire exporter needs the
  # sdk and the OTLP/HTTP exporter. Declared explicitly on purpose --
  # arize-phoenix-otel used to pull these in transitively, and removing it
  # (Phoenix fully retired, see docs/plans/observability-platform-plan.md)
  # would otherwise have stopped telemetry silently, which is the failure
  # this explicit declaration exists to prevent.
  - opentelemetry-api
  - opentelemetry-sdk
  - opentelemetry-exporter-otlp-proto-http
  - python-telegram-bot
  - apscheduler
  - oci-cli
  # storage/ -- the pluggable SQLite/Postgres backend (see
  # docs/plans/data-layer-plan.md). Core only, no ORM: query text is
  # written by hand (sqlalchemy.text() + named binds) throughout, Core is
  # used only for portable bind-param translation, Table/MetaData-driven
  # DDL (storage/schema.py), and schema introspection.
  - sqlalchemy
  # Postgres driver for storage/postgres/ -- binary build, no separate
  # libpq/build-toolchain install needed.
  - psycopg2-binary
  # news_keyness.py -- POS-tags article text (nouns only) to score how
  # "foreign" a word is to an interest's article pool, for offbeat/novelty
  # selection (docs/analysis/cluster-measurements.md's "Offbeat selection,
  # take two"). Conda-forge's nltk is clean -- `conda search -c conda-forge
  # nltk --info` shows only click/joblib/regex/tqdm/defusedxml, no
  # torch/scipy-class dependency, unlike model2vec's conda-forge recipe
  # above -- so this one installs the normal way, no pip detour needed.
  - nltk
  # news_embed.py -- article/topic embeddings for near-duplicate collapse
  # and offbeat/novelty selection in news_push.select_candidate_articles.
  # docs/analysis/cluster-measurements.md is the measurement behind this
  # specific choice: fastembed and sentence-transformers were both
  # measured too heavy for the deploy target's available RAM, and TF-IDF
  # was measured to have NEGATIVE separation on this corpus (a false
  # positive outscored a true match).
  #
  # Installed via pip, NOT as a conda-forge package -- confirmed the hard
  # way (a local Docker build here on 2026-08-25, +1.88 GB on one layer)
  # that conda-forge's model2vec recipe declares pytorch, onnx,
  # transformers, scikit-learn, lightning, rich and skops as HARD runtime
  # dependencies of the conda package, even though PyPI's own metadata
  # marks every one of them an optional "distill"/"onnx"/"train"/
  # "quantization" extra that model2vec's actual encode()/from_pretrained()
  # path never imports. `conda search -c conda-forge model2vec --info`
  # confirms this directly. Same shape as the CLAUDE.md arize-phoenix
  # lesson: a package's declared dependencies do not transfer identically
  # between packaging ecosystems, so don't assume they do -- measure the
  # actual install. The pip wheel's base install really is just
  # jinja2/joblib/numpy/safetensors/tokenizers/tqdm, confirmed the same
  # way (`pip show model2vec`, and the built image's own `pip list`).
  - pip
  - pip:
      - model2vec
      # Settings resolution -- extracted from this project's own settings
      # work into a standalone, language-independent library (2026-09-01,
      # see docs/README.md's pointer for the extraction history).
      # PyPI-only, no conda-forge recipe.
      - trailsign
      # vector_store/sqlite_vec_store.py -- a pluggable, faster
      # news_cache backend (see that module's own docstring for the
      # measured ~12s/2000-file bottleneck it fixes). No conda-forge
      # recipe. Measured 2026-09-05 on the actual deploy target's
      # container: ~176KB installed, zero transitive dependencies (unlike
      # model2vec above, this one genuinely has none to worry about), and
      # ~180KB real incremental memory once numpy is already loaded
      # (which it already is, via model2vec) -- confirmed via real
      # before/after RSS measurement, not assumed.
      - sqlite-vec
