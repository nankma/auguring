# See settings.yml's own comments for what each of these controls.
push:
  tick_seconds: 900
  max_articles_per_topic: 5
  max_interests_per_push: 5
  max_html_attempts: 3
  near_duplicate_similarity: 0.95
  max_article_age_hours: 168
  unreachable_strikes: 3
  relevance_keep:
    fraction: 0.10
    min: 20
    max: 50
  novelty_relevance_keep:
    fraction: 0.20
    min: 40
    max: 100

search:
  max_results: 5
  daily_limit: 10
  relevance_keep:
    fraction: 0.10
    min: 20
    max: 50

subscription:
  default_interval_hours: 24
  min_interval_hours: 1
  pushed_link_retention_hours: 72
  max_interests: 10

categories:
  proposal_threshold: 5
  sighting_retention_days: 30

# Bridges to the vault-fetched TELEGRAM_BOT_TOKEN/ADMIN_BOT_TOKEN/
# ADMIN_CHAT_ID env vars docker-entrypoint.sh already sets.
delivery:
  telegram:
    bot-token:
      trailsign-resolve: environment-variable
      name: TELEGRAM_BOT_TOKEN
    admin-bot-token:
      trailsign-resolve: environment-variable
      name: ADMIN_BOT_TOKEN
    admin-chat-id:
      trailsign-resolve: environment-variable
      name: ADMIN_CHAT_ID

# Turning telemetry off is now "remove LOGFIRE_API_KEY_SECRET_OCID from
# docker_run.command" (an unresolvable credential drops this entry
# quietly) -- no separate enabled flag to keep in sync (see
# docs/standaloneplan/01-settings-migration.md's "Telemetry providers"
# sections for why the old two-lever design was a real incident risk).
# One otlp entry here feeds both general-event logging and LLM-call
# tracing -- don't duplicate it into a second entry, see the same doc
# sections for why that caused a real double-export bug.
telemetry:
  providers:
    - type: otlp
      endpoint: https://logfire-us.pydantic.dev/v1/traces
      headers:
        Authorization:
          trailsign-resolve: environment-variable
          name: LOGFIRE_API_KEY
      instrument_langchain: true

test_api:
  enabled:
    trailsign-resolve: environment-variable
    name: ENABLE_TEST_API
  port:
    trailsign-resolve: environment-variable
    name: TEST_API_PORT
