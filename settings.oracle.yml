# Production-target settings file (Oracle VM). Real values must NEVER
# go here (env-var names/placeholders only) -- see CLAUDE.md's
# Landmines. A real OCID/IP/secret goes in a gitignored file under
# local-infra/ instead. This file is load-bearing once deployed
# (required=True keys) -- see
# docs/standaloneplan/01-settings-migration.md for the full deploy
# process and why.

storage:
  # ttl_hours must stay a sibling of path, never nested inside path's
  # trailsign-resolve node -- it would be silently discarded (see
  # docs/standaloneplan/01-settings-migration.md's "Worth exposing"
  # table, DEFAULT_TTL_HOURS row, for the confirmed-live gotcha).
  news_cache_dir:
    path:
      trailsign-resolve: environment-variable
      name: NEWS_CACHE_DIR
    ttl_hours: 48
  news_archive_dir:
    trailsign-resolve: environment-variable
    name: NEWS_ARCHIVE_DIR
  message_archive_dir:
    path:
      trailsign-resolve: environment-variable
      name: MESSAGE_ARCHIVE_DIR
    ttl_days: 7
  # PROD stays sqlite -- the Postgres backend (storage/postgres/) is
  # proven on INT only so far, see docs/plans/data-layer-plan.md's
  # "Seam built" section for the trigger to revisit.
  database:
    type: sqlite
    sqlite:
      path:
        trailsign-resolve: environment-variable
        name: SUBSCRIBERS_DB_FILE

# Pluggable news-cache backend (vector_store/) -- PROD stays on
# yaml_files (today's behavior, unchanged) until sqlite_vec is proven on
# INT first, same "prove it there before PROD" pattern as
# storage.database's own postgres option above.
news_cache:
  backend:
    type: yaml_files
    # sqlite_vec:
    #   path:
    #     trailsign-resolve: environment-variable
    #     name: NEWS_VECTOR_DB_FILE

# Bridges to the same DEEPSEEK_API_KEY env var docker-entrypoint.sh
# already vault-fetches -- zero behavior change from before this was
# migrated to Settings.
models:
  main:
    url: https://api.deepseek.com
    model: deepseek-v4-flash
    api-key:
      trailsign-resolve: environment-variable
      name: DEEPSEEK_API_KEY
    reasoning_effort: none
    request_timeout_seconds: 60
  guardrail:
    url: https://api.deepseek.com
    model: deepseek-v4-flash
    api-key:
      trailsign-resolve: environment-variable
      name: DEEPSEEK_API_KEY
    reasoning_effort: none
    request_timeout_seconds: 20

# ONE news_source: key for the whole file -- a second top-level mapping
# silently drops everything above it (real incident, see
# docs/standaloneplan/01-settings-migration.md's "news_source.*"
# section). newsapi/gnews/perigon bridge to the real vault-fetched keys;
# production has all three live (unlike settings.yml's commented
# preview). Keep the rss: list byte-identical to settings.yml's -- this
# is the file production actually reads.
news_source:
  tick_seconds: 900
  default_interval_hours: 4
  request_delay_seconds: 1.1

  api:
    - key: newsapi
      type: newsapi
      api-key:
        trailsign-resolve: environment-variable
        name: NEWSAPI_API_KEY
      interval_hours: 24
      daily_cap: 1
    - key: gnews
      type: gnews
      api-key:
        trailsign-resolve: environment-variable
        name: GNEWS_API_KEY
    - key: perigon
      type: perigon
      api-key:
        trailsign-resolve: environment-variable
        name: PERIGON_API_KEY
      interval_hours: 8
      daily_cap: 3

  rss:
    - key: openai_blog
      display_name: OpenAI Blog
      url: https://openai.com/news/rss.xml
    - key: huggingface_blog
      display_name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml
